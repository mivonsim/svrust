[package]
name = "sv-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Content-addressed cache untuk parsing, elaboration, dan codegen SVRust"

[dependencies]
sv-diag = { path = "../sv-diag" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
sv-lexer = { path = "../sv-lexer" }
sv-parser = { path = "../sv-parser" }
sv-elaborator = { path = "../sv-elaborator" }
sv-codegen-rust = { path = "../sv-codegen-rust" }
