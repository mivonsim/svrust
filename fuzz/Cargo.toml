[package]
name = "sv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

# Workspace sendiri: `cargo fuzz` membangun crate ini dengan nightly +
# sanitizer, yang tidak boleh ikut workspace utama.
[workspace]

[package.metadata]
cargo-fuzz = true

# SATU fuzz target untuk seluruh mode. Mode dipilih dari byte pertama di dalam
# `fuzz_targets/svrust.rs`; tidak perlu bin per mode karena korpus, build, dan
# perintah jalannya akan terduplikasi.
[[bin]]
name = "svrust"
path = "fuzz_targets/svrust.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"

# Generator + invariant checker milik SVRust ada di crate terpisah
# (`sv-fuzzkit`) supaya bisa dipakai juga oleh runner non-libFuzzer
# (mis. pembanding multimah dengan simulator lain).
sv-fuzzkit = { path = "../fuzzkit" }

[dependencies.sv-lexer]
path = "../crates/sv-lexer"
[dependencies.sv-preprocessor]
path = "../crates/sv-preprocessor"
[dependencies.sv-ast]
path = "../crates/sv-ast"
[dependencies.sv-parser]
path = "../crates/sv-parser"
[dependencies.sv-ir]
path = "../crates/sv-ir"
[dependencies.sv-elaborator]
path = "../crates/sv-elaborator"
[dependencies.sv-opt]
path = "../crates/sv-opt"
[dependencies.sv-runtime]
path = "../crates/sv-runtime"
[dependencies.sv-codegen-rust]
path = "../crates/sv-codegen-rust"

[profile.release]
debug = 1