[package]
name = "sv-fuzzkit"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }

[dependencies.sv-lexer]
path = "../crates/sv-lexer"
[dependencies.sv-preprocessor]
path = "../crates/sv-preprocessor"
[dependencies.sv-ast]
path = "../crates/sv-ast"
[dependencies.sv-parser]
path = "../crates/sv-parser"
[dependencies.sv-ir]
path = "../crates/sv-ir"
[dependencies.sv-elaborator]
path = "../crates/sv-elaborator"
[dependencies.sv-opt]
path = "../crates/sv-opt"
[dependencies.sv-codegen-rust]
path = "../crates/sv-codegen-rust"